{% extends "base.html" %}

{% block title %}Subscribe - ChatSecure{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm rounded-3xl shadow-2xl border border-gray-200 dark:border-gray-700 p-8 md:p-12 animate-fade-in">
    <div class="text-center mb-8">
        <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-600 bg-clip-text text-transparent mb-3">
            Join ChatSecure
        </h1>
        <p class="text-gray-600 dark:text-gray-300 text-lg">Create your account to start chatting</p>
    </div>

    <form method="POST" action="{{ url_for('subscribe') }}" class="space-y-6" novalidate>
        <div>
            <label for="email" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
                Email Address
            </label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                required
                class="w-full px-4 py-3 bg-white/50 dark:bg-slate-700/50 border border-gray-300 dark:border-gray-600 rounded-2xl focus:outline-none focus:ring-4 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all duration-300 text-lg placeholder-gray-500 dark:placeholder-gray-400 shadow-sm"
                placeholder="your@email.com"
                autocomplete="email"
            >
        </div>

        <div>
            <label for="password" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
                Password
            </label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                required 
                minlength="8"
                class="w-full px-4 py-3 bg-white/50 dark:bg-slate-700/50 border border-gray-300 dark:border-gray-600 rounded-2xl focus:outline-none focus:ring-4 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all duration-300 text-lg placeholder-gray-500 dark:placeholder-gray-400 shadow-sm"
                placeholder="At least 8 characters"
                autocomplete="new-password"
            >
        </div>

        <div>
            <label for="confirm_password" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
                Confirm Password
            </label>
            <input 
                type="password" 
                id="confirm_password" 
                name="confirm_password" 
                required 
                minlength="8"
                class="w-full px-4 py-3 bg-white/50 dark:bg-slate-700/50 border border-gray-300 dark:border-gray-600 rounded-2xl focus:outline-none focus:ring-4 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all duration-300 text-lg placeholder-gray-500 dark:placeholder-gray-400 shadow-sm"
                placeholder="Confirm your password"
                autocomplete="new-password"
            >
        </div>

        <button 
            type="submit"
            class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-semibold py-4 px-6 rounded-2xl shadow-xl hover:shadow-2xl transform hover:-translate-y-1 transition-all duration-300 text-lg"
        >
            Create Account
        </button>
    </form>

    <p class="text-center mt-8 text-sm text-gray-600 dark:text-gray-400">
        Already subscribed? 
        <a href="{{ url_for('login') }}" class="font-semibold text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 dark:hover:text-indigo-300 transition-colors">
            Sign in here
        </a>
    </p>
</div>
{% endblock %}
