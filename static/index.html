<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Real-Time Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 text-gray-900 dark:text-gray-100 antialiased font-sans">
    <div class="flex flex-col h-full max-w-6xl mx-auto p-4 md:p-6 lg:p-8">
        <!-- Header -->
        <header class="mb-6 md:mb-8 text-center">
            <h1 class="text-3xl md:text-4xl lg:text-5xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent drop-shadow-lg">
                FastAPI Real-Time Chat
            </h1>
            <p class="mt-2 text-sm md:text-base text-gray-500 dark:text-gray-400">Powered by WebSocket & Redis Cache</p>
        </header>

        <!-- Messages Container -->
        <main id="messages" class="flex-1 mb-4 md:mb-6 overflow-y-auto scroll-smooth border border-gray-200 dark:border-gray-700 rounded-2xl p-6 md:p-8 bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm shadow-2xl ring-1 ring-inset ring-white/10 space-y-4 hide-scrollbar">
            <!-- Messages will be appended here -->
        </main>

        <!-- Input Form -->
        <form id="message-form" class="flex gap-3 p-4 md:p-6 bg-white/50 dark:bg-slate-800/50 backdrop-blur-sm border border-gray-200 dark:border-gray-700 rounded-2xl shadow-xl ring-1 ring-inset ring-white/10">
            <input 
                type="text" 
                id="message-input" 
                placeholder="Type your message..." 
                autocomplete="off"
                class="flex-1 px-4 py-3 md:px-6 md:py-4 text-base md:text-lg bg-white/60 dark:bg-slate-700/60 backdrop-blur-sm border border-gray-200 dark:border-gray-600 rounded-xl focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all duration-300 resize-none placeholder-gray-500 dark:placeholder-gray-400 shadow-sm"
            >
            <button 
                type="submit"
                class="px-6 md:px-8 py-3 md:py-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold text-base md:text-lg rounded-xl shadow-lg hover:shadow-xl hover:scale-105 active:scale-95 transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-indigo-500/30 whitespace-nowrap"
            >
                Send Message
            </button>
        </form>
    </div>

    <style>
        .hide-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .hide-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }
        .hide-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.7);
        }
    </style>

    <script>
        const ws = new WebSocket("ws://localhost:8000/ws");
        const messages = document.getElementById('messages');
        const form = document.getElementById('message-form');
        const input = document.getElementById('message-input');

        ws.onmessage = function(event) {
            const item = document.createElement('div');
            item.className = 'message flex flex-col animate-fade-in p-4 bg-gradient-to-r from-white/90 to-gray-50 dark:from-slate-700/90 dark:to-slate-800/90 rounded-2xl shadow-md hover:shadow-lg transition-all duration-200 border border-white/50 dark:border-slate-600/50 max-w-[90%] md:max-w-[75%] lg:max-w-[60%]';
            try {
                const match = event.data.match(/^\[([^\]]+)\]\s*User:\s*(.+)$/);
                if (match) {
                    console.log('Parsed message:', match[1], match[2]);
                    const timestamp = match[1];
                    const text = match[2];
                    const textDiv = document.createElement('div');
                    textDiv.className = 'text font-semibold text-lg md:text-xl leading-tight break-words';
                    textDiv.textContent = text;
                    const tsDiv = document.createElement('div');
                    tsDiv.className = 'timestamp text-xs md:text-sm mt-1 font-mono text-gray-500 dark:text-gray-400 opacity-80';
                    tsDiv.textContent = timestamp;
                    item.appendChild(textDiv);
                    item.appendChild(tsDiv);
                } else {
                    console.log('No match:', event.data);
                    item.textContent = event.data;
                }
            } catch (err) {
                console.error('Message parse error:', err, event.data);
                item.textContent = event.data;
            }
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        };

        form.onsubmit = function(e) {
            e.preventDefault();
            console.log('Send:', input.value);
            if (input.value.trim()) {
                ws.send(input.value.trim());
                input.value = '';
                input.focus();
            }
        };

        // Auto-focus input
        input.focus();
    </script>
</body>
</html>
